services:

  postgres:
    image: postgres:15
    container_name: helpy_postgres
    restart: always
    environment:
      POSTGRES_USER: helpy
      POSTGRES_PASSWORD: helpy
      POSTGRES_DB: helpy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - helpy_network

  redis:
    image: redis:7
    container_name: helpy_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - helpy_network

 
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: helpy_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - helpy_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: helpy_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: helpy_zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - helpy_network

  multi-agent-service:
    build:
      context: ../..
      dockerfile: services/multi-agent-service/Dockerfile
    container_name: helpy_multi_agent_service
    restart: always
    ports:
      - "4005:4005"
    environment:
      - KAFKA_BROKER=kafka:29092
    depends_on:
      - postgres
      - redis
      - kafka

    
    networks:
      - helpy_network

  
volumes:
  postgres_data:
  redis_data:

networks:
  helpy_network:
    driver: bridge